<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ご予約の残り確認</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
  /* layout: 朝の田んぼを背景にした細い1列。おにぎりっこが案内し、品種ごとに担当の子が残りを持って立つ */
  :root {
    --sky: #e4eff3;
    --paddy: #edf4e8;
    --surface: #ffffff;
    --ink: #1d2620;
    --muted: #5c6a60;
    --line: #d4ddd0;
    --accent: #2f6b3a;
    --accent-ink: #ffffff;
    --accent-soft: #e2ece0;
    --bubble: #ffffff;
    --track: #e6ebe2;
    --warn-bg: #fbefe7;
    --warn-ink: #8a3f17;
    --warn-line: #e7c3ab;
    --nishiki: #c9442b;
    --hime: #dc6f98;
    --masamune: #7b50b2;
    --hitomi: #d9a514;
    --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky: #121a22; --paddy: #101712; --surface: #18211b; --ink: #e8ede6; --muted: #9eab9f;
      --line: #2a352c; --accent: #84c28e; --accent-ink: #0e1a11; --accent-soft: #203026;
      --bubble: #1f2a22; --track: #263027; --warn-bg: #2a1c15; --warn-ink: #f2b893; --warn-line: #5b3a27;
      --nishiki: #f07a5f; --hime: #f39bbd; --masamune: #b08ae0; --hitomi: #f1c84b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --sky: #121a22; --paddy: #101712; --surface: #18211b; --ink: #e8ede6; --muted: #9eab9f;
    --line: #2a352c; --accent: #84c28e; --accent-ink: #0e1a11; --accent-soft: #203026;
    --bubble: #1f2a22; --track: #263027; --warn-bg: #2a1c15; --warn-ink: #f2b893; --warn-line: #5b3a27;
    --nishiki: #f07a5f; --hime: #f39bbd; --masamune: #b08ae0; --hitomi: #f1c84b;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: linear-gradient(180deg, var(--sky) 0, var(--paddy) 360px) var(--paddy);
    color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.75;
    padding-inline: 18px; padding-block: 22px 44px; min-height: 100%;
    -webkit-text-size-adjust: 100%;
  }
  .col { max-width: 520px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }

  header { text-align: center; display: flex; flex-direction: column; gap: 2px; }
  .farm { font-size: 12.5px; letter-spacing: .24em; color: var(--accent); font-weight: 700; }
  h1 { font-family: var(--font-display); font-weight: 900; font-size: 27px; line-height: 1.35;
       margin: 0; text-wrap: balance; }
  .crop { font-size: 13.5px; color: var(--muted); margin: 0; }

  /* おにぎりっこの案内 */
  .guide { display: flex; align-items: flex-end; gap: 10px; }
  .guide img { width: 84px; height: auto; flex: none; }
  .bubble { position: relative; flex: 1; min-width: 0; background: var(--bubble);
            border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 14px;
            font-family: var(--font-display); font-weight: 700; font-size: 16px; line-height: 1.55;
            margin-bottom: 18px; }
  .bubble::before { content: ""; position: absolute; left: -9px; bottom: 14px; width: 16px; height: 16px;
                    background: var(--bubble); border-left: 1.5px solid var(--line);
                    border-bottom: 1.5px solid var(--line); transform: rotate(45deg); }

  .lookup { background: var(--surface); border: 2px solid var(--accent); border-radius: 18px;
            padding: 18px; display: flex; flex-direction: column; gap: 11px; }
  .lookup label { font-size: 14.5px; font-weight: 700; }
  .lookup input {
    width: 100%; font-family: var(--font-mono); font-weight: 600; font-size: 30px;
    letter-spacing: .18em; text-align: center; padding: 12px 8px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--paddy); color: var(--ink);
  }
  .lookup input::placeholder { font-family: var(--font-body); font-size: 17px; letter-spacing: .06em; color: var(--muted); }
  .lookup input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
  .btn-main {
    font-family: var(--font-display); font-size: 18px; font-weight: 900; letter-spacing: .06em;
    padding: 14px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 60%, #000);
    transition: transform .08s, box-shadow .08s;
  }
  .btn-main:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 60%, #000); }
  .btn-main:focus-visible, .btn-sub:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .hint { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.7; }
  .miss { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-line);
          border-radius: 12px; padding: 11px 14px; font-size: 14px; margin: 0; }

  .sample-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .pill { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; padding: 1px 10px;
          border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .sample .item { opacity: .82; }

  /* 品種の行（担当のキャラクターつき） */
  .items { display: flex; flex-direction: column; gap: 10px; }
  .item { --c: var(--accent); display: grid; grid-template-columns: 58px 1fr; gap: 4px 12px;
          align-items: center; background: var(--surface); border: 1px solid var(--line);
          border-left: 5px solid var(--c); border-radius: 14px; padding: 10px 14px 12px 10px; }
  .item img { grid-row: 1 / span 3; width: 58px; height: auto; align-self: end; }
  .item-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; min-width: 0; }
  .item-name { font-size: 17px; font-weight: 700; min-width: 0; }
  .item-name small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); line-height: 1.3; }
  .item-left { font-family: var(--font-display); font-weight: 900; font-size: 23px; color: var(--c);
               white-space: nowrap; font-variant-numeric: tabular-nums; }
  .item-left span { font-size: 14px; margin-left: 2px; }
  .bar { height: 9px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--c); border-radius: 999px; }
  .item-sub { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .c-nishiki { --c: var(--nishiki); }
  .c-hime { --c: var(--hime); }
  .c-masamune { --c: var(--masamune); }
  .c-hitomi { --c: var(--hitomi); }

  .codeline { text-align: center; font-size: 13px; color: var(--muted); display: flex;
              flex-direction: column; gap: 0; }
  .codeline b { font-family: var(--font-mono); letter-spacing: .16em; color: var(--ink); }

  .remain { position: relative; overflow: hidden; background: var(--accent); color: var(--accent-ink);
            border-radius: 18px; padding: 18px 20px 18px 120px; min-height: 132px;
            display: flex; flex-direction: column; justify-content: center; gap: 0; }
  .remain img { position: absolute; left: 10px; bottom: -6px; width: 104px; height: auto; }
  .remain .t { font-size: 13.5px; opacity: .88; }
  .remain .v { font-family: var(--font-display); font-weight: 900; font-size: 50px; line-height: 1.1;
               font-variant-numeric: tabular-nums; }
  .remain .v small { font-size: 22px; margin-left: 4px; }
  .remain .k { font-size: 14px; opacity: .92; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
          padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .card h2 { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--accent);
             margin: 0; padding: 0 2px 6px; border-bottom: 1px solid var(--line); }
  .card .item { border-top: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .totals { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
            font-size: 13px; color: var(--muted); padding: 2px 2px 0; font-variant-numeric: tabular-nums; }

  .note { background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
          padding: 14px 17px; font-size: 14px; }
  .note p { margin: 0 0 6px; font-weight: 700; color: var(--accent); }
  .note ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }

  .btn-sub { align-self: center; font-family: var(--font-display); font-weight: 700; font-size: 15px;
             padding: 10px 22px; border-radius: 999px; cursor: pointer;
             background: var(--surface); color: var(--accent); border: 1.5px solid var(--accent); }

  .gang { display: flex; justify-content: center; gap: 4px; margin-top: 6px; }
  .gang img { width: 46px; height: auto; }

  footer { text-align: center; font-size: 12.5px; color: var(--muted); line-height: 1.9; }
  footer a { color: var(--muted); }

  @media (prefers-reduced-motion: no-preference) {
    .result { animation: up .3s ease-out; }
    .guide img { animation: bob 2.6s ease-in-out infinite; }
    @keyframes up { from { transform: translateY(8px); opacity: .5; } to { transform: none; opacity: 1; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  }
</style>
</head>
<body>
<div class="col">
  <header>
    <div class="farm">ホタル農園</div>
    <h1>ご予約の残り確認</h1>
    <p class="crop">令和8年産　先行予約</p>
  </header>

  <div class="guide">
    <img src="img/c-onigirikko.png" alt="おにぎりっこ">
    <div class="bubble" id="bubble" aria-live="polite">確認番号を入れてね！<br>お預かりしているお米が分かるよ。</div>
  </div>

  <!-- 入力 -->
  <form class="lookup" id="lookup" autocomplete="off" novalidate>
    <label for="code">確認番号（数字6けた）</label>
    <input id="code" name="code" type="text" inputmode="numeric" maxlength="7" placeholder="000-000">
    <button class="btn-main" type="submit" id="go">残りを見る</button>
    <p class="hint">確認番号は、ご予約のときにお知らせしております。真ん中の「−」は、なくても大丈夫です。</p>
    <p class="miss" id="miss" hidden></p>
  </form>

  <!-- 見本 -->
  <section class="sample" id="sample" aria-label="見本">
    <div class="sample-head"><span class="pill">見本</span>番号を入れると、このように出ます</div>
    <div class="items" style="margin-top:8px">
      <div class="item c-nishiki">
        <img src="img/c-nishiki.png" alt="">
        <div class="item-top"><span class="item-name">ササニシキ 精米<small>にしきがお預かり中</small></span>
          <span class="item-left">40<span>kg</span></span></div>
        <div class="bar"><span style="width:66.7%"></span></div>
        <div class="item-sub">ご予約 60kg　／　お届けずみ 20kg</div>
      </div>
    </div>
  </section>

  <!-- 結果 -->
  <section class="result" id="result" hidden>
    <div class="col">
      <div class="codeline"><span>確認番号　<b id="r-code"></b></span><span id="r-date"></span></div>

      <div class="remain">
        <img src="img/c-onigirikko.png" alt="">
        <div class="t">いまお預かりしている残り</div>
        <div class="v" id="r-left">0<small>kg</small></div>
        <div class="k" id="r-times"></div>
      </div>

      <div class="card">
        <h2>ご予約の内わけ</h2>
        <div class="items" id="r-items"></div>
        <div class="totals"><span id="r-res"></span><span id="r-done"></span></div>
      </div>

      <div class="note" id="r-note"></div>

      <button class="btn-sub" type="button" id="again">ほかの番号を見る</button>
    </div>
  </section>

  <footer>
    <div class="gang" aria-hidden="true">
      <img src="img/c-nishiki.png" alt=""><img src="img/c-hime.png" alt="">
      <img src="img/c-masamune.png" alt=""><img src="img/c-hitomi.png" alt="">
    </div>
    ホタル農園　<a href="https://hotarufarm.github.io/" target="_blank" rel="noopener">ホームページ</a><br>
    この画面にはお名前・ご住所・お電話番号は入っておりません。
  </footer>
</div>

<script>
  const KOUSHIN = "2026年10月5日";

  // 確認番号 → ［品目, ご予約kg, お届けずみkg］　お名前は入れていません
  const DATA = {
    "382-088": [["ササニシキ 精米",120,0]],
    "568-611": [["ササニシキ 玄米",90,0]],
    "980-215": [["ササニシキ 精米",60,0],["つや姫 精米",60,0]],
    "557-409": [["ササニシキ 精米",20,0],["だて正夢 精米",20,0]],
    "792-276": [["ササニシキ 精米",80,0]],
    "387-848": [["ササニシキ 玄米",20,0],["つや姫 玄米",20,0],["ひとめぼれ 玄米",20,0],["だて正夢 玄米",20,0]],
    "122-314": [["ササニシキ 玄米",60,0],["つや姫 玄米",40,0],["だて正夢 玄米",20,0]],
    "806-799": [["ササニシキ 精米",20,0],["ササニシキ 玄米",5,0],["つや姫 精米",10,0],["つや姫 玄米",5,0]],
    "166-695": [["つや姫 玄米",80,0],["だて正夢 玄米",20,0]],
    "236-357": [["ササニシキ 精米",20,0]],
    "139-559": [["ササニシキ 玄米",210,0]],
    "624-232": [["つや姫 精米",10,0]],
    "455-996": [["ササニシキ 精米",20,0],["つや姫 精米",20,0],["だて正夢 精米",20,0]],
    "268-700": [["ササニシキ 精米",20,0],["つや姫 精米",20,0],["ひとめぼれ 精米",10,0],["だて正夢 精米",10,0]],
    "778-061": [["ササニシキ 精米",140,0]],
    "563-343": [["ササニシキ 玄米",60,0]],
    "286-732": [["ササニシキ 玄米",10,0],["ササニシキ 精米",5,0]],
    "890-531": [["ササニシキ 精米",40,0],["ササニシキ 玄米",40,0]],
    "963-036": [["ササニシキ 玄米",10,0]],
    "888-548": [["ササニシキ 精米",10,0]],
    // ホタルさんのお試し用（お客様のものではありません）
    "484-601": [["ササニシキ 玄米",20,0],["つや姫 精米",20,0],["だて正夢 玄米",20,0],["ひとめぼれ 精米",20,0]]
  };

  // 品種 → 担当のキャラクター
  const CHARA = {
    "ササニシキ": { img: "img/c-nishiki.png",  name: "にしき",   cls: "c-nishiki" },
    "つや姫":     { img: "img/c-hime.png",     name: "ひめ",     cls: "c-hime" },
    "だて正夢":   { img: "img/c-masamune.png", name: "まさむね", cls: "c-masamune" },
    "ひとめぼれ": { img: "img/c-hitomi.png",   name: "ひとみ",   cls: "c-hitomi" }
  };

  const $ = (id) => document.getElementById(id);
  const kz = (n) => (Math.round(n * 10) / 10).toLocaleString("ja-JP");
  const clean = (s) => (s || "").toUpperCase().replace(/[^0-9A-Z]/g, "");
  const BUBBLE0 = $("bubble").innerHTML;

  function times(n) {
    if (n <= 0) return "";
    const kai = Math.floor(n / 20), amari = Math.round((n - kai * 20) * 10) / 10;
    if (kai === 0) return "20kgには足りませんので、" + kz(amari) + "kgぶんです";
    if (amari === 0) return "20kgずつですと、あと " + kai + " 回ぶんです";
    return "20kgずつですと、あと " + kai + " 回と " + kz(amari) + "kgです";
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function show(code, rows) {
    let res = 0, done = 0, left = 0;
    const box = $("r-items");
    box.replaceChildren();
    rows.forEach(([name, y, d]) => {
      const n = y - d;
      res += y; done += d; left += n;
      const ch = CHARA[name.split(" ")[0]] || null;
      const item = el("div", "item" + (ch ? " " + ch.cls : ""));
      if (ch) { const im = el("img"); im.src = ch.img; im.alt = ch.name; item.append(im); }
      const top = el("div", "item-top");
      const nm = el("span", "item-name", name);
      if (ch) nm.append(el("small", null, ch.name + "がお預かり中"));
      const lf = el("span", "item-left", kz(n));
      lf.append(el("span", null, "kg"));
      top.append(nm, lf);
      const bar = el("div", "bar");
      const fill = el("span");
      fill.style.width = (y > 0 ? Math.max(0, n / y * 100) : 0) + "%";
      bar.append(fill);
      item.append(top, bar, el("div", "item-sub", "ご予約 " + kz(y) + "kg　／　お届けずみ " + kz(d) + "kg"));
      box.append(item);
    });

    $("r-code").textContent = code;
    $("r-date").textContent = KOUSHIN + "　現在";
    $("r-left").replaceChildren(document.createTextNode(kz(left)), el("small", null, "kg"));
    $("r-times").textContent = times(left);
    $("r-res").textContent = "ご予約の合計 " + kz(res) + "kg";
    $("r-done").textContent = "お届けずみ " + kz(done) + "kg";
    $("bubble").textContent = left > 0
      ? "あと " + kz(left) + "kg、ちゃんとお預かりしてるよ！"
      : "ぜんぶお届けしたよ。一年間ありがとう！";

    const note = $("r-note");
    note.replaceChildren();
    if (left > 0) {
      const ul = el("ul");
      ["20kg以上の発送は送料無料です。20kg未満は送料がかかります",
       "玄米を精米に、8分つきに、糠がほしい、などのご希望も承ります",
       "お預かりしているお米は、鮮度を保って保管しております"].forEach(t => ul.append(el("li", null, t)));
      note.append(el("p", null, "ご入用のときは、品種と量をお知らせください。"), ul);
    } else {
      note.append(el("p", null, "ご予約いただいたぶんは、すべてお届けが済んでおります。"),
                  el("div", null, "一年間ありがとうございました。またのご縁を心よりお待ちしております。"));
    }

    $("lookup").hidden = true;
    $("sample").hidden = true;
    $("result").hidden = false;
    window.scrollTo(0, 0);
  }

  $("lookup").addEventListener("submit", (e) => {
    e.preventDefault();
    const key = clean($("code").value);
    const miss = $("miss");
    const hit = Object.keys(DATA).find(k => clean(k) === key);
    if (!hit) {
      miss.textContent = key.length === 0
        ? "確認番号を入れてください。"
        : "この番号のご予約が見あたりませんでした。打ちまちがいがないか、もう一度お確かめください。分からないときは、ホタル農園までお気軽にお知らせください。";
      miss.hidden = false;
      $("bubble").textContent = key.length === 0 ? "番号を入れてね！" : "あれれ？ その番号は見つからないよ…";
      return;
    }
    miss.hidden = true;
    show(hit, DATA[hit]);
  });

  $("again").addEventListener("click", () => {
    $("result").hidden = true;
    $("lookup").hidden = false;
    $("sample").hidden = false;
    $("bubble").innerHTML = BUBBLE0;
    $("code").value = "";
    $("code").focus();
  });
</script>
</body>
</html>
