<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ご予約の残り確認｜ホタル農園</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --midori:#2f6b3a; --usu:#f2f6f2; --sen:#cbd6cb; }
  * { box-sizing: border-box; }
  body { font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
         color:#1a1a1a; background:#f4f3ee; margin:0; padding:18px 14px 40px;
         line-height:1.75; -webkit-text-size-adjust:100%; }
  .waku { max-width:560px; margin:0 auto; }

  header { text-align:center; margin-bottom:20px; }
  header .no { font-size:13px; color:var(--midori); letter-spacing:.14em; }
  header h1 { font-size:21px; margin:6px 0 4px; }
  header p { font-size:13.5px; color:#666; margin:0; }

  .ire { background:#fff; border:2px solid var(--midori); border-radius:12px;
         padding:18px 16px; margin-bottom:18px; }
  .ire label { display:block; font-size:14px; color:#444; margin-bottom:8px; }
  .ire input { width:100%; font-size:26px; letter-spacing:.14em; text-align:center;
               padding:12px 8px; border:1px solid #bbb; border-radius:8px;
               font-family:inherit; text-transform:uppercase; }
  .ire button { width:100%; margin-top:11px; font-family:inherit; font-size:17px;
                font-weight:700; padding:13px; border:0; border-radius:8px;
                background:var(--midori); color:#fff; cursor:pointer; }
  .ire .hint { font-size:12.5px; color:#888; margin-top:9px; }

  .shippai { background:#fff4ef; border:1px solid #e0b89f; color:#9c4a1c;
             border-radius:10px; padding:13px 15px; font-size:14px; }

  .kekka { display:none; }
  .ban { text-align:center; font-size:13px; color:#777; margin-bottom:12px;
         letter-spacing:.1em; }

  .hako { background:#fff; border:1px solid var(--sen); border-radius:12px;
          padding:16px; margin-bottom:14px; }
  .hako h2 { font-size:14px; color:var(--midori); margin:0 0 12px;
             padding-bottom:7px; border-bottom:1px solid #e5e8e3; }

  .gyo { border:1px solid #e7e9e4; border-radius:9px; padding:11px 13px; margin-bottom:9px; }
  .gyo .ue { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .gyo .mei { font-size:17px; font-weight:700; }
  .gyo .uchi { font-size:13px; color:#888; margin-top:3px; }
  .gyo .nok { font-size:19px; font-weight:700; color:var(--midori); white-space:nowrap; }
  .goukei { font-size:13px; color:#666; text-align:right; margin-top:8px; line-height:1.6; }

  .zan { background:var(--midori); color:#fff; border-radius:12px;
         padding:16px 18px; text-align:center; margin-bottom:14px; }
  .zan .t { font-size:13.5px; color:#cfe0d2; }
  .zan .v { font-size:44px; font-weight:700; line-height:1.15; }
  .zan .v .u { font-size:20px; margin-left:3px; }
  .zan .k { font-size:14px; color:#dcebdf; margin-top:4px; }

  .annai { background:#fff; border:1px solid var(--sen); border-radius:12px;
           padding:14px 16px; font-size:13.5px; color:#444; }
  .annai b { color:var(--midori); }
  .annai ul { margin:7px 0 0; padding-left:1.2em; }
  .annai li { margin-bottom:5px; }

  footer { text-align:center; font-size:12px; color:#999; margin-top:22px; line-height:1.9; }
  footer a { color:#777; }
  .koushin { text-align:center; font-size:12.5px; color:#888; margin-bottom:14px; }
</style>
</head>
<body>
<div class="waku">

  <header>
    <div class="no">ホタル農園</div>
    <h1>ご予約の残り確認</h1>
    <p>令和8年産　先行予約</p>
  </header>

  <div class="ire" id="ireru">
    <label for="code">確認番号を入れてください</label>
    <input id="code" type="text" inputmode="latin" autocomplete="off"
           placeholder="＊＊＊-＊＊＊" maxlength="7">
    <button id="miru">残りを見る</button>
    <div class="hint">
      確認番号は、ご予約のお礼とあわせてお送りしております。<br>
      小文字で入れても大丈夫です。「−」はあってもなくてもかまいません。
    </div>
    <div id="shippai" style="display:none; margin-top:11px"></div>
  </div>

  <div class="kekka" id="kekka">
    <div class="ban" id="ban"></div>
    <div class="koushin" id="koushin"></div>

    <div class="zan">
      <div class="t">いまお預かりしている残り</div>
      <div class="v" id="zan-v">–<span class="u">kg</span></div>
      <div class="k" id="zan-k"></div>
    </div>

    <div class="hako">
      <h2>ご予約の内わけ</h2>
      <div id="uchiwake"></div>
    </div>

    <div class="annai" id="annai"></div>

    <div style="text-align:center; margin-top:16px">
      <button id="modoru" style="font-family:inherit; font-size:14px; padding:9px 18px;
        border:1px solid #bbb; background:#fff; border-radius:8px; cursor:pointer">
        ほかの番号を見る</button>
    </div>
  </div>

  <footer>
    ホタル農園<br>
    <a href="https://hotarufarm.github.io/">ホームページにもどる</a><br>
    この画面にはお名前・ご住所・お電話番号は入っておりません。
  </footer>

</div>

<script>
// 更新した日
const KOUSHIN = "2026年10月3日";

// 確認番号 → ご予約の中身　［品目, ご予約kg, お届けずみkg］
// お名前は入れていません。
const DATA = {
  "L72-R6A": [["ササニシキ 精米",120,0]],
  "R8D-V4U": [["ササニシキ 玄米",90,0]],
  "SPR-YR7": [["ササニシキ 精米",60,0],["つや姫 精米",60,0]],
  "XXS-RGZ": [["ササニシキ 精米",20,0],["だて正夢 精米",20,0]],
  "XUQ-NX9": [["ササニシキ 精米",80,0]],
  "RP2-7FP": [["ササニシキ 玄米",20,0],["つや姫 玄米",20,0],["ひとめぼれ 玄米",20,0],["だて正夢 玄米",20,0]],
  "XBC-RJE": [["ササニシキ 玄米",60,0],["つや姫 玄米",40,0],["だて正夢 玄米",20,0]],
  "26Y-V9D": [["ササニシキ 精米",20,0],["ササニシキ 玄米",5,0],["つや姫 精米",10,0],["つや姫 玄米",5,0]],
  "H5F-377": [["つや姫 玄米",80,0],["だて正夢 玄米",20,0]],
  "JM5-4LJ": [["ササニシキ 精米",20,0]],
  "CCF-KPE": [["ササニシキ 玄米",210,0]],
  "ZZW-SQU": [["つや姫 精米",10,0]],
  "XZ9-62G": [["ササニシキ 精米",20,0],["つや姫 精米",20,0],["だて正夢 精米",20,0]],
  "AP4-DHC": [["ササニシキ 精米",20,0],["つや姫 精米",20,0],["ひとめぼれ 精米",10,0],["だて正夢 精米",10,0]],
  "S9B-JMY": [["ササニシキ 精米",140,0]],
  "B24-FPP": [["ササニシキ 玄米",60,0]],
  "SGJ-QQL": [["ササニシキ 玄米",10,0],["ササニシキ 精米",5,0]],
  "EW3-R37": [["ササニシキ 精米",40,0],["ササニシキ 玄米",40,0]],
  "HH6-K39": [["ササニシキ 玄米",10,0]],
  "6UN-XKN": [["ササニシキ 精米",10,0]],
  // ホタルさんのお試し用（お客様のものではありません）
  "G2X-TYD": [["ササニシキ 玄米",20,0],["つや姫 精米",20,0],["だて正夢 玄米",20,0],["ひとめぼれ 精米",20,0]]
};

function kz(n){ return (Math.round(n*10)/10).toLocaleString("ja-JP"); }

function nankai(n){
  if (n <= 0) return "";
  const kai = Math.floor(n/20), amari = Math.round((n - kai*20)*10)/10;
  if (kai === 0) return "20kgには足りませんので、" + kz(amari) + "kgぶんです";
  if (amari === 0) return "20kgずつですと、あと " + kai + " 回ぶんです";
  return "20kgずつですと、あと " + kai + " 回と " + kz(amari) + "kgです";
}

function seikei(s){
  return (s || "").toUpperCase().replace(/[^0-9A-Z]/g, "");
}

function miru(){
  const nama = document.getElementById("code").value;
  const key = seikei(nama);
  const sh = document.getElementById("shippai");

  let hit = null, hitKey = "";
  Object.keys(DATA).forEach(function(k){
    if (seikei(k) === key) { hit = DATA[k]; hitKey = k; }
  });

  if (!hit) {
    sh.style.display = "block";
    sh.className = "shippai";
    sh.innerHTML = (key.length === 0)
      ? "確認番号を入れてください。"
      : "この番号のご予約が見あたりませんでした。<br>" +
        "打ちまちがいがないか、もう一度お確かめください。<br>" +
        "分からないときは、ホタル農園までお気軽にお知らせください。";
    return;
  }
  sh.style.display = "none";

  let yKei = 0, dKei = 0, nKei = 0, html = "";
  hit.forEach(function(r){
    const mei = r[0], y = r[1], d = r[2], n = y - d;
    yKei += y; dKei += d; nKei += n;
    html += '<div class="gyo">' +
      '<div class="ue"><span class="mei">' + mei + '</span>' +
      '<span class="nok">' + kz(n) + ' kg</span></div>' +
      '<div class="uchi">ご予約 ' + kz(y) + 'kg　／　お届けずみ ' + kz(d) + 'kg</div>' +
      '</div>';
  });
  html += '<div class="goukei">ご予約の合計 ' + kz(yKei) + 'kg<br>' +
          'お届けずみ ' + kz(dKei) + 'kg</div>';

  document.getElementById("uchiwake").innerHTML = html;
  document.getElementById("zan-v").innerHTML = kz(nKei) + '<span class="u">kg</span>';
  document.getElementById("zan-k").textContent = nankai(nKei);
  document.getElementById("ban").textContent = "確認番号　" + hitKey;
  document.getElementById("koushin").textContent = KOUSHIN + "　現在";

  document.getElementById("annai").innerHTML = (nKei > 0)
    ? '<b>ご入用のときは、品種と量をお知らせください。</b>' +
      '<ul>' +
      '<li>20kg以上の発送は<b>送料無料</b>です。20kg未満は送料がかかります</li>' +
      '<li>玄米を精米に、8分つきに、糠がほしい、などのご希望も承ります</li>' +
      '<li>お預かりしているお米は、鮮度を保って保管しております</li>' +
      '</ul>'
    : '<b>ご予約いただいたぶんは、すべてお届けが済んでおります。</b>' +
      '<div style="margin-top:6px">一年間ありがとうございました。' +
      'またのご縁を心よりお待ちしております。</div>';

  document.getElementById("ireru").style.display = "none";
  document.getElementById("kekka").style.display = "block";
  window.scrollTo(0,0);
}

document.getElementById("miru").addEventListener("click", miru);
document.getElementById("code").addEventListener("keydown", function(e){
  if (e.key === "Enter") miru();
});
document.getElementById("modoru").addEventListener("click", function(){
  document.getElementById("kekka").style.display = "none";
  document.getElementById("ireru").style.display = "block";
  document.getElementById("code").value = "";
  document.getElementById("code").focus();
});
</script>
</body>
</html>
